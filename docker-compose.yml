services:
  claude-alexa:
    image: claude-alexa:latest
    container_name: claude-alexa
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:3001:3001"
    env_file:
      - .env
    volumes:
      - claude-credentials:/home/node
      - ./.claude:/app/.claude:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "1"
    restart: unless-stopped
    networks:
      - claude-alexa-network

networks:
  claude-alexa-network:
    driver: bridge

volumes:
  claude-credentials:
