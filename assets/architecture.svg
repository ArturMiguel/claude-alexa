<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 465" width="100%" height="100%" style="font-family: &#39;Segoe Print&#39;, &#39;Comic Sans MS&#39;, Chalkboard, cursive, sans-serif;">
  <defs>
    <marker id="arrow-neutral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2f9e44" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#e03131" />
    </marker>
  </defs>

  
  <rect x="330" y="30" width="510" height="395" rx="16" fill="rgba(134, 142, 150, 0.08)" stroke="#64748b" stroke-width="2" stroke-dasharray="8,6" />
  <text x="350" y="57" font-size="15" font-weight="bold" fill="#64748b">Servidor Local (Self-Hosted)</text>

  
  <rect x="40" y="80" width="200" height="100" rx="12" fill="#a5d8ff" stroke="#1971c2" stroke-width="2.5" />
  <text x="140" y="123" font-size="16" font-weight="bold" text-anchor="middle" fill="#1e1e1e">Dispositivo Alexa</text>
  <text x="140" y="147" font-size="14" text-anchor="middle" fill="#1e1e1e">(Voz -&gt; Intent JSON)</text>

  
  <rect x="360" y="80" width="210" height="100" rx="12" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2.5" />
  <text x="465" y="113" font-size="15" font-weight="bold" text-anchor="middle" fill="#1e1e1e">Endpoint HTTPS</text>
  <text x="465" y="135" font-size="13" text-anchor="middle" fill="#1e1e1e">Valida Assinatura,</text>
  <text x="465" y="153" font-size="13" text-anchor="middle" fill="#1e1e1e">Skill ID e Timestamp</text>

  
  <rect x="615" y="80" width="200" height="100" rx="12" fill="#ffd8a8" stroke="#e8590c" stroke-width="2.5" />
  <text x="715" y="113" font-size="15" font-weight="bold" text-anchor="middle" fill="#1e1e1e">Claude Code CLI</text>
  <text x="715" y="135" font-size="13" text-anchor="middle" fill="#1e1e1e">(Modo Restrito +</text>
  <text x="715" y="153" font-size="13" text-anchor="middle" fill="#1e1e1e">System Prompt TTS)</text>

  
  <polygon points="585,250 685,320 585,390 485,320" fill="#ffec99" stroke="#f08c00" stroke-width="2.5" />
  <text x="585" y="315" font-size="15" font-weight="bold" text-anchor="middle" fill="#1e1e1e">Respondeu</text>
  <text x="585" y="335" font-size="15" font-weight="bold" text-anchor="middle" fill="#1e1e1e">no prazo?</text>

  
  <rect x="890" y="270" width="195" height="100" rx="12" fill="#d0ebff" stroke="#1971c2" stroke-width="2.5" />
  <text x="987" y="313" font-size="16" font-weight="bold" text-anchor="middle" fill="#1e1e1e">Bot do Telegram</text>
  <text x="987" y="337" font-size="14" text-anchor="middle" fill="#1e1e1e">(Entrega assíncrona)</text>

  
  <line x1="240" y1="130" x2="352" y2="130" stroke="#64748b" stroke-width="2.2" marker-end="url(#arrow-neutral)" />
  <text x="296" y="120" font-size="12" font-weight="bold" text-anchor="middle" fill="#64748b">POST HTTPS</text>

  
  <line x1="570" y1="130" x2="607" y2="130" stroke="#64748b" stroke-width="2.2" marker-end="url(#arrow-neutral)" />

  
  <polyline points="715,180 715,270 655,270" fill="none" stroke="#64748b" stroke-width="2.2" marker-end="url(#arrow-neutral)" />

  
  <polyline points="485,320 140,320 140,188" fill="none" stroke="#2f9e44" stroke-width="2.5" marker-end="url(#arrow-green)" />
  <text x="310" y="308" font-size="14" font-weight="bold" text-anchor="middle" fill="#2f9e44">Sim: Resposta falada na hora</text>

  
  <line x1="685" y1="320" x2="882" y2="320" stroke="#e03131" stroke-width="2.5" marker-end="url(#arrow-red)" />
  <text x="785" y="293" font-size="13" font-weight="bold" text-anchor="middle" fill="#e03131">Não (Timeout):</text>
  <text x="785" y="310" font-size="13" text-anchor="middle" fill="#e03131">Avisa na voz e segue async</text>
</svg>